name: Deploy to FTP

on:
  push:
    branches:
      - main # Ubah ke nama branch yang Anda gunakan (contoh: main atau master)

jobs:
  deploy:
    name: Deploy to FTP Server
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🚀 Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          
          # Folder tujuan di FTP server Anda (biasanya /public_html/ atau /htdocs/)
          # Pastikan berakhiran dengan slash (/)
          server-dir: ./ukm.satta.web.id/
          
          # Menghindari upload file sampah/development ke server
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.github/**
            README.md
            .env.example
            phpunit.xml
